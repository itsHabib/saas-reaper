<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="A goofy little armless reaper blob, its scythe leaning against it, beside a tombstone reading R.I.P. per-seat pricing">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3040"/>
      <stop offset="1" stop-color="#14181f"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab3bf"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
  </defs>

  <!-- moon -->
  <circle cx="640" cy="70" r="34" fill="#e8e4d8" opacity="0.9"/>
  <path d="M 640 36 a 34 34 0 1 0 0 68 a 27 27 0 1 1 0 -68 z" fill="#cfc9b8" opacity="0.35"/>

  <!-- ground -->
  <path d="M 40 366 Q 380 344 720 366 L 720 372 Q 380 352 40 372 z" fill="#5d6673" opacity="0.7"/>
  <g stroke="#5d6673" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M 120 362 l -4 -14 M 128 362 l 2 -12 M 136 362 l -2 -9"/>
    <path d="M 596 360 l -3 -12 M 604 360 l 3 -10 M 612 360 l -1 -8"/>
  </g>

  <!-- tombstone -->
  <g>
    <path d="M 464 234 a 81 66 0 0 1 162 0 l 0 132 l -162 0 z" fill="url(#stone)"/>
    <text x="545" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#2c3340">R.I.P.</text>
    <text x="545" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2c3340">per-seat</text>
    <text x="545" y="324" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2c3340">pricing</text>
    <path d="M 537 344 l 16 0 M 545 336 l 0 20" stroke="#2c3340" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- scythe -->
  <g>
    <line x1="158" y1="112" x2="212" y2="362" stroke="#5b4636" stroke-width="9" stroke-linecap="round"/>
    <path d="M 158 112 C 214 64 300 70 346 116 C 292 96 216 102 166 136 z" fill="#c9d2dd"/>
    <path d="M 158 112 C 214 64 300 70 346 116 C 332 102 308 92 284 86 C 240 78 192 90 158 112 z" fill="#eef2f6"/>
  </g>

  <!-- reaper: unassuming blob -->
  <g>
    <path d="M 190 366
             C 182 292 190 214 224 168
             C 232 128 268 112 292 122
             C 318 132 330 162 324 192
             C 352 244 360 306 354 366
             z" fill="url(#robe)"/>
    <!-- hood opening + goofy face -->
    <path d="M 288 134 C 264 138 254 162 258 182 C 274 194 304 190 314 174 C 316 152 306 134 288 134 z" fill="#07090c"/>
    <circle cx="280" cy="162" r="5" fill="#7ef0a8"/>
    <circle cx="300" cy="160" r="5" fill="#7ef0a8"/>
  </g>
</svg>
