<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="The SaaS Reaper holds a scythe and a green feature flag beside a tombstone reading R.I.P. per-seat pricing">
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3040"/>
      <stop offset="1" stop-color="#14181f"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab3bf"/>
      <stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
  </defs>

  <!-- moon -->
  <circle cx="640" cy="70" r="34" fill="#e8e4d8" opacity="0.9"/>
  <circle cx="654" cy="62" r="30" fill="#f6f8fa" opacity="0.01"/>
  <circle cx="652" cy="62" r="28" fill="none"/>
  <path d="M 640 36 a 34 34 0 1 0 0 68 a 27 27 0 1 1 0 -68 z" fill="#cfc9b8" opacity="0.35"/>

  <!-- ground -->
  <path d="M 40 366 Q 380 344 720 366 L 720 372 Q 380 352 40 372 z" fill="#5d6673" opacity="0.7"/>
  <g stroke="#5d6673" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M 120 362 l -4 -14 M 128 362 l 2 -12 M 136 362 l -2 -9"/>
    <path d="M 596 360 l -3 -12 M 604 360 l 3 -10 M 612 360 l -1 -8"/>
  </g>

  <!-- tombstone -->
  <g>
    <rect x="470" y="240" width="150" height="126" rx="8" fill="#6c7684"/>
    <path d="M 470 268 a 75 60 0 0 1 150 0 l 0 -20 a 75 60 0 0 0 -150 0 z" fill="#6c7684"/>
    <path d="M 464 234 a 81 66 0 0 1 162 0 l 0 132 l -162 0 z" fill="url(#stone)"/>
    <text x="545" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#2c3340">R.I.P.</text>
    <text x="545" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2c3340">per-seat</text>
    <text x="545" y="324" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2c3340">pricing</text>
    <path d="M 537 344 l 16 0 M 545 336 l 0 20" stroke="#2c3340" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- scythe -->
  <g>
    <line x1="150" y1="88" x2="236" y2="368" stroke="#5b4636" stroke-width="9" stroke-linecap="round"/>
    <path d="M 150 88 C 210 44 296 52 344 96 C 288 78 212 82 158 112 z" fill="#c9d2dd"/>
    <path d="M 150 88 C 210 44 296 52 344 96 C 330 84 306 74 282 70 C 236 62 186 70 150 88 z" fill="#eef2f6"/>
  </g>

  <!-- reaper -->
  <g>
    <!-- robe -->
    <path d="M 300 150
             C 300 108 262 92 238 100
             C 208 110 196 140 200 168
             C 176 220 168 282 176 366
             L 210 366 L 218 322 L 228 366 L 262 366 L 268 318 L 282 366 L 330 366
             C 336 286 330 210 300 150 z" fill="url(#robe)"/>
    <!-- hood opening + face -->
    <path d="M 236 112 C 214 118 206 142 210 160 C 224 170 252 168 262 154 C 264 132 254 114 236 112 z" fill="#07090c"/>
    <circle cx="230" cy="140" r="4.5" fill="#7ef0a8"/>
    <circle cx="248" cy="140" r="4.5" fill="#7ef0a8"/>
    <!-- arm to scythe -->
    <path d="M 292 190 C 260 178 232 186 208 206 C 200 214 206 228 218 224 C 240 210 264 204 288 210 z" fill="#1b202b"/>
    <path d="M 196 214 a 11 11 0 1 0 22 0 a 11 11 0 1 0 -22 0" fill="#3a4252"/>
    <!-- arm to flag -->
    <path d="M 302 178 C 326 176 344 188 354 206 C 358 216 348 224 340 216 C 330 202 316 194 300 194 z" fill="#1b202b"/>
    <path d="M 338 210 a 10 10 0 1 0 20 0 a 10 10 0 1 0 -20 0" fill="#3a4252"/>
  </g>

  <!-- feature flag in hand -->
  <g>
    <line x1="352" y1="212" x2="352" y2="120" stroke="#8a93a1" stroke-width="5" stroke-linecap="round"/>
    <path d="M 352 122 L 430 138 L 352 156 z" fill="#22c55e"/>
    <circle cx="368" cy="139" r="6" fill="#0b3d22"/>
    <circle cx="370" cy="139" r="4" fill="#eafff2"/>
  </g>
</svg>
