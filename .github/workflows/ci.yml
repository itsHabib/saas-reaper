name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static and behavioral checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The WORK.md contract validator resolves its git subject commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            specimens/webhook-delivery/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            examples/typescript/package-lock.json
            specimens/webhook-delivery/receivers/typescript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            examples/python/requirements.txt
            specimens/webhook-delivery/receivers/python/requirements.txt
      - name: Install system verification tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep rsync shellcheck
      - name: Run fast verification floor
        run: make check

  product-demo:
    name: Generated product matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The WORK.md contract validator resolves its git subject commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            specimens/webhook-delivery/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            examples/typescript/package-lock.json
            specimens/webhook-delivery/receivers/typescript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            examples/python/requirements.txt
            specimens/webhook-delivery/receivers/python/requirements.txt
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false
      - name: Install system verification tools
        run: sudo apt-get update && sudo apt-get install --yes curl jq ripgrep shellcheck unzip
      - name: Run generated product proof
        run: make product-demo

  webhook-proof:
    name: Webhook interoperability and invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            specimens/webhook-delivery/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            examples/typescript/package-lock.json
            specimens/webhook-delivery/receivers/typescript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            examples/python/requirements.txt
            specimens/webhook-delivery/receivers/python/requirements.txt
      - name: Install local proof tools
        run: sudo apt-get update && sudo apt-get install --yes curl jq
      - name: Install pinned proof dependencies
        run: make setup
      - name: Run loopback-only webhook proofs
        run: make webhook-demo webhook-invariants

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The scan action lists a pull request's commits through the API.
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan tracked history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The action defaults to 8.24.3, which silently ignores this
          # repository's [[allowlists]] tables (supported from 8.25).
          GITLEAKS_VERSION: "8.30.1"
